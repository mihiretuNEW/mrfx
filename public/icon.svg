<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="40%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bullGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Obsidian Background with Smooth Bevel -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#cyanGrad)" stroke-width="4" opacity="0.75"/>
  <rect x="14" y="14" width="484" height="484" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.4"/>

  <!-- Bull Horns & Head Icon -->
  <g transform="translate(146, 55) scale(0.43)" filter="url(#glow)">
    <path d="M120,40 C170,10 240,60 270,120 C290,160 310,210 320,260 C290,240 250,230 210,240 C180,180 150,120 120,40 Z" fill="url(#cyanGrad)"/>
    <path d="M400,40 C350,10 280,60 250,120 C230,160 210,210 200,260 C230,240 270,230 310,240 C340,180 370,120 400,40 Z" fill="url(#goldGrad)"/>
    <path d="M210,240 L310,240 L280,380 L240,380 Z" fill="url(#goldGrad)" opacity="0.9"/>
  </g>

  <!-- Green Ascending Breakout Candlesticks -->
  <line x1="130" y1="210" x2="130" y2="350" stroke="#34d399" stroke-width="4"/>
  <rect x="116" y="240" width="28" height="90" rx="4" fill="url(#bullGreen)"/>

  <line x1="180" y1="180" x2="180" y2="330" stroke="#34d399" stroke-width="4"/>
  <rect x="166" y="205" width="28" height="100" rx="4" fill="url(#bullGreen)"/>

  <line x1="230" y1="150" x2="230" y2="310" stroke="#34d399" stroke-width="4"/>
  <rect x="216" y="175" width="28" height="110" rx="4" fill="url(#bullGreen)"/>

  <!-- Breakout Trend Line with Arrow -->
  <path d="M 100 320 L 160 260 L 210 280 L 320 145" fill="none" stroke="#4ade80" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <polygon points="320,130 338,158 310,154" fill="#4ade80"/>

  <!-- Big Bold Gold "75" Badge -->
  <text x="375" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="140" fill="url(#goldGrad)" text-anchor="middle" filter="url(#glow)">75</text>

  <!-- Typography Brand at Bottom -->
  <text x="256" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="4" text-anchor="middle">
    MIRE<tspan fill="#f59e0b">75</tspan> <tspan fill="#38bdf8" font-size="28" font-weight="700">TRADER</tspan>
  </text>
  <text x="256" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#64748b" letter-spacing="3" text-anchor="middle">VOLATILITY 75 AUTOMATION</text>
</svg>
