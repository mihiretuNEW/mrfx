<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Suppress benign [vite] HMR websocket notifications, cross-origin frame access, and React scheduler race conditions in preview
      (function() {
        const origError = console.error;
        const origWarn = console.warn;
        function safeString(a) {
          try {
            if (a === null || a === undefined) return '';
            if (typeof a === 'string') return a;
            if (typeof a === 'object') {
              if (a.message) return String(a.message);
              return '';
            }
            return String(a);
          } catch (e) {
            return '';
          }
        }
        console.error = function(...args) {
          try {
            const msg = args.map(safeString).join(' ');
            if (msg.includes('[vite]') || msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('cross-origin frame') || msg.includes('Blocked a frame') || msg.includes('Should not already be working')) {
              return;
            }
          } catch (e) {
            return;
          }
          origError.apply(console, args);
        };
        console.warn = function(...args) {
          try {
            const msg = args.map(safeString).join(' ');
            if (msg.includes('[vite]') || msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('cross-origin frame') || msg.includes('Blocked a frame')) {
              return;
            }
          } catch (e) {
            return;
          }
          origWarn.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          try {
            const msg = (e && e.message) ? String(e.message) : '';
            if (msg.includes('[vite]') || msg.includes('WebSocket') || msg.includes('cross-origin frame') || msg.includes('Blocked a frame') || msg.includes('Should not already be working')) {
              e.preventDefault();
              e.stopPropagation();
            }
          } catch (err) {}
        }, true);
      })();
    </script>
    <meta name="description" content="A professional web charting platform replicating TradingView with Deriv live WebSocket API, featuring Nexus: Smart Money Suite [BullByte], Mpro & Mpro2 Signals, and empirical factor audit journal." />
    <meta name="theme-color" content="#131722" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="Mcharts" />

    <meta property="og:title" content="Mcharts Charting Platform" />
    <meta property="og:description" content="A professional web charting platform replicating TradingView with Deriv live WebSocket API, featuring Nexus: Smart Money Suite [BullByte], Mpro & Mpro2 Signals, and empirical factor audit journal." />
    <title>Mcharts Charting Platform</title>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
