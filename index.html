<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Suppress benign [vite] HMR websocket connection notifications in container preview
      (function() {
        const origError = console.error;
        const origWarn = console.warn;
        console.error = function(...args) {
          const msg = args.map(a => (typeof a === 'object' ? (a && a.message) || '' : String(a))).join(' ');
          if (msg.includes('[vite]') || msg.includes('WebSocket') || msg.includes('websocket')) {
            return;
          }
          origError.apply(console, args);
        };
        console.warn = function(...args) {
          const msg = args.map(a => (typeof a === 'object' ? (a && a.message) || '' : String(a))).join(' ');
          if (msg.includes('[vite]') || msg.includes('WebSocket') || msg.includes('websocket')) {
            return;
          }
          origWarn.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.includes('[vite]') || e.message.includes('WebSocket'))) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
      })();
    </script>
    <meta name="description" content="A professional web charting platform replicating TradingView with Deriv live WebSocket API, featuring Nexus: Smart Money Suite [BullByte], Mpro & Mpro2 Signals, and empirical factor audit journal." />
    <meta name="theme-color" content="#131722" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mcharts" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <meta property="og:title" content="Mcharts Charting Platform" />
    <meta property="og:description" content="A professional web charting platform replicating TradingView with Deriv live WebSocket API, featuring Nexus: Smart Money Suite [BullByte], Mpro & Mpro2 Signals, and empirical factor audit journal." />
    <title>Mcharts Charting Platform</title>
  </head>

  </body>
</html>
